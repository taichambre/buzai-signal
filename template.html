<meta charset="utf-8">
<title>調達アラート</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="原材料・部材ごとの価格高騰と納期逼迫の度合いを、区分を選んで確認する購買向けコンソール。仕入先の値上げ・納期延長の回答が相場で裏付けられるかを交渉前に見る。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#f5f6f8; --panel:#ffffff; --rail:#eef0f3; --raise:#f4f5f7; --sink:#e8eaee;
  --ink:#191e25; --ink-soft:#586470; --ink-mute:#8b96a2;
  --line:#e0e3e8; --line-soft:#eceef1;
  --accent:#1f5f8b; --accent-soft:#e8f0f6; --accent-ink:#164b70;
  --sev0:#2f8f6f; --sev1:#66788a; --sev2:#bd882a; --sev3:#c96a37; --sev4:#bf3a2f;
  --sev0-bg:#e6f2ee; --sev1-bg:#edf0f2; --sev2-bg:#f7edda; --sev3-bg:#f8e8de; --sev4-bg:#f7e2df;
  --rise:#bf3a2f; --fall:#1f6d80;
  --shadow-1:0 1px 2px rgba(20,28,38,.06);
  --shadow-2:0 8px 28px -14px rgba(20,28,38,.24), 0 2px 6px rgba(20,28,38,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0f1216; --panel:#181c22; --rail:#14171c; --raise:#1e232a; --sink:#232830;
    --ink:#e7eaee; --ink-soft:#9aa5b1; --ink-mute:#6c7681;
    --line:#282e36; --line-soft:#20252c;
    --accent:#5aa6d2; --accent-soft:#17303f; --accent-ink:#8cc4e4;
    --sev0:#41b78f; --sev1:#8996a4; --sev2:#d7a442; --sev3:#e07c4c; --sev4:#e05c50;
    --sev0-bg:#14322a; --sev1-bg:#242a31; --sev2-bg:#33291542; --sev3-bg:#361f16; --sev4-bg:#361b18;
    --rise:#e07c4c; --fall:#5eb4c6;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 12px 34px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0f1216; --panel:#181c22; --rail:#14171c; --raise:#1e232a; --sink:#232830;
  --ink:#e7eaee; --ink-soft:#9aa5b1; --ink-mute:#6c7681;
  --line:#282e36; --line-soft:#20252c;
  --accent:#5aa6d2; --accent-soft:#17303f; --accent-ink:#8cc4e4;
  --sev0:#41b78f; --sev1:#8996a4; --sev2:#d7a442; --sev3:#e07c4c; --sev4:#e05c50;
  --sev0-bg:#14322a; --sev1-bg:#242a31; --sev2-bg:#332915; --sev3-bg:#361f16; --sev4-bg:#361b18;
  --rise:#e07c4c; --fall:#5eb4c6;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 12px 34px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size:15px; line-height:1.7; letter-spacing:.012em; -webkit-font-smoothing:antialiased;}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; letter-spacing:0}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
h1,h2,h3{text-wrap:balance; margin:0}

/* ---- app shell ---- */
.app{display:flex; flex-direction:column; min-height:100%}
.topbar{display:flex; align-items:center; gap:14px; padding:0 18px; height:52px; flex:none;
  background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15.5px; letter-spacing:.02em}
.brand .dot{width:9px; height:9px; border-radius:2px; background:var(--accent); flex:none; transform:rotate(45deg)}
.topbar .spacer{flex:1}
.topbar .stamp{font-size:11.5px; color:var(--ink-mute); text-align:right; line-height:1.35}
.topbar .stamp b{color:var(--ink-soft); font-weight:500}
.tglt{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--raise);
  border-radius:8px; padding:5px 9px; font-size:12px; color:var(--ink-soft)}
.tglt svg{width:15px; height:15px; display:block}

.body{display:grid; grid-template-columns:308px 1fr; flex:1; min-height:0}
@media (max-width:860px){ .body{grid-template-columns:1fr} }

/* ---- rail ---- */
.rail{background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column;
  overflow-y:auto; padding:12px 10px 18px}
.rail-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 8px 10px}
.rail-head .lbl{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute)}
.sortbtn{border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:3px 8px; font-size:11.5px; color:var(--ink-soft)}
.navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.navrow{width:100%; text-align:left; background:none; border:0; border-radius:9px; padding:9px 10px 9px 12px;
  display:grid; grid-template-columns:10px 1fr auto; gap:10px; align-items:center; position:relative; transition:background .12s}
.navrow:hover{background:var(--panel)}
.navrow[aria-current="true"]{background:var(--panel); box-shadow:var(--shadow-1)}
.navrow[aria-current="true"]::before{content:""; position:absolute; left:2px; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--accent)}
.navrow .nd{width:10px; height:10px; border-radius:50%; flex:none}
.navrow .nm{min-width:0}
.navrow .nm b{display:block; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.navrow .nm span{display:block; font-size:11px; color:var(--ink-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.navrow .nlv{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; white-space:nowrap}
.rail-sep{height:1px; background:var(--line); margin:12px 8px}
.navrow.aux{grid-template-columns:16px 1fr; }
.navrow.aux .ai{color:var(--ink-mute); display:flex}
.navrow.aux b{font-size:12.5px; font-weight:500; color:var(--ink-soft)}
.navrow.aux[aria-current="true"] b{color:var(--ink); font-weight:700}

.d0{color:var(--sev0)} .d1{color:var(--sev1)} .d2{color:var(--sev2)} .d3{color:var(--sev3)} .d4{color:var(--sev4)}
.bd0{background:var(--sev0)} .bd1{background:var(--sev1)} .bd2{background:var(--sev2)} .bd3{background:var(--sev3)} .bd4{background:var(--sev4)}
.lv0{color:var(--sev0); background:var(--sev0-bg)} .lv1{color:var(--sev1); background:var(--sev1-bg)}
.lv2{color:var(--sev2); background:var(--sev2-bg)} .lv3{color:var(--sev3); background:var(--sev3-bg)} .lv4{color:var(--sev4); background:var(--sev4-bg)}

/* ---- detail pane ---- */
.pane{overflow-y:auto; padding:26px 30px 60px}
.pane-inner{max-width:680px; margin:0 auto}
@media (max-width:860px){
  .rail{border-right:0; border-bottom:1px solid var(--line); max-height:none; padding-bottom:12px}
  .pane{padding:20px 18px 48px}
  body.detail-open .rail{display:none}
  body:not(.detail-open) .pane{display:none}
  .backbtn{display:inline-flex!important}
}
.backbtn{display:none; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel);
  border-radius:8px; padding:5px 11px 5px 8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:16px}

.dhead{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.dhead h2{font-size:22px; font-weight:700; letter-spacing:.01em; line-height:1.25}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:3px 11px 3px 9px;
  border-radius:999px; white-space:nowrap; letter-spacing:.02em}
.pill i{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.dsub{margin:7px 0 0; font-size:12.5px; color:var(--ink-mute); line-height:1.65}

.verdict{margin:20px 0 0; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px;
  background:var(--panel); padding:15px 17px; box-shadow:var(--shadow-1)}
.verdict.g3{border-left-color:var(--sev3)} .verdict.g4{border-left-color:var(--sev4)} .verdict.g2{border-left-color:var(--sev2)}
.verdict .vk{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-mute)}
.verdict .vt{margin:5px 0 0; font-size:15px; line-height:1.75; font-weight:500}
.verdict .vt b{font-weight:700}

.block{margin-top:26px}
.block > h3{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); display:flex; align-items:center; gap:8px}
.block > h3::after{content:""; flex:1; height:1px; background:var(--line)}
.block p{margin:9px 0 0; font-size:13.5px; line-height:1.8; color:var(--ink-soft)}
.block p b{color:var(--ink); font-weight:700}
.figrow{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px}
.fig{background:var(--raise); border:1px solid var(--line-soft); border-radius:9px; padding:9px 12px; min-width:104px}
.fig .fk{font-size:10px; color:var(--ink-mute); letter-spacing:.03em}
.fig .fv{font-size:18px; font-weight:700; margin-top:1px; line-height:1.2}
.fig .fv small{font-size:10.5px; font-weight:400; color:var(--ink-mute)}
.fig .fv.up{color:var(--rise)} .fig .fv.down{color:var(--fall)}

.chart-wrap{position:relative; margin-top:14px}
svg.chart{display:block; width:100%; height:auto; overflow:visible}
.chart text{font-family:"IBM Plex Mono", monospace; fill:var(--ink-mute)}
.chart .axis-line{stroke:var(--line); stroke-width:1}
.chart .grid{stroke:var(--line-soft); stroke-width:1}
.chart .zero{stroke:var(--line); stroke-width:1.4}
.chart .serie{fill:none; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.chart .serie.ref{stroke-width:1.6; stroke-dasharray:2 4}
.chart .band{fill:color-mix(in srgb, var(--rise) 7%, transparent)}
.chart .band-edge{stroke:color-mix(in srgb, var(--rise) 26%, transparent); stroke-width:1; stroke-dasharray:3 3}
.chart .end-label{font-size:11px; font-weight:500}
.chart .cross{stroke:var(--ink-mute); stroke-width:1; stroke-dasharray:3 3}
.chart .dot{stroke:var(--panel); stroke-width:1.5}
.tt{position:absolute; pointer-events:none; z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:8px;
  box-shadow:var(--shadow-2); padding:8px 10px; font-size:12px; min-width:128px; opacity:0; transition:opacity .1s}
.tt .tt-d{color:var(--ink-mute); font-size:11px; margin-bottom:4px}
.tt .tt-r{display:flex; justify-content:space-between; gap:14px; align-items:center}
.tt .tt-r .sw{width:8px; height:8px; border-radius:2px; flex:none; margin-right:5px}
.tt .tt-r span:first-child{display:flex; align-items:center; color:var(--ink-soft)}
.legend{display:flex; gap:13px; flex-wrap:wrap; padding:8px 2px 0; font-size:11.5px; color:var(--ink-soft)}
.legend .item{display:flex; align-items:center; gap:6px}
.legend .ln{width:14px; height:0; border-top:2px solid currentColor}
.legend .ln.ref{border-top-style:dashed}
.spark{display:block; width:100%; height:44px; margin-top:10px; color:var(--sev3)}

.voices{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
.voices li{font-size:12.5px; line-height:1.7; color:var(--ink-soft); padding-left:14px; position:relative}
.voices li::before{content:""; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.voices li b{color:var(--ink); font-weight:700}
.voices .vsrc{color:var(--ink-mute); font-size:10.5px}
.note{margin:10px 0 0; background:var(--sev2-bg); border:1px solid var(--line-soft); border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.7}
.note b{color:var(--sev2)}

details.tech{margin-top:26px; border-top:1px solid var(--line); padding-top:12px}
details.tech summary{cursor:pointer; color:var(--ink-mute); font-weight:500; font-size:12.5px; list-style:none}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary::before{content:"▸ "; font-size:10px}
details.tech[open] summary::before{content:"▾ "}
.tech-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(116px,1fr)); gap:11px; margin-top:12px}
.tech-cell{background:var(--raise); border:1px solid var(--line-soft); border-radius:9px; padding:10px 12px}
.tech-cell .tk{font-size:10px; color:var(--ink-mute)}
.tech-cell .tv{font-size:19px; font-weight:700; margin-top:2px}
.tech-cell .tv small{font-size:10.5px; font-weight:400; color:var(--ink-mute)}
.tech-note{margin:12px 0 0; font-size:11px; color:var(--ink-mute); line-height:1.7}

/* market / explorer / about panes reuse .block */
.mkt-summary{font-size:14px; line-height:1.8; margin:14px 0 0; color:var(--ink)}
.spotgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px}
.spot{background:var(--raise); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px}
.spot .sl{font-size:11.5px; color:var(--ink-mute); font-weight:500}
.spot .sv{font-weight:700; font-size:14px; margin:2px 0}
.spot .sc{font-size:11px}
.spot .sn{font-size:10.5px; color:var(--ink-mute); margin-top:3px; line-height:1.5}
.hl{margin-top:10px; border:1px solid var(--line-soft); border-left:3px solid var(--ink-mute); border-radius:9px; padding:11px 13px; background:var(--panel)}
.hl.sev-high{border-left-color:var(--sev4)} .hl.sev-med{border-left-color:var(--sev2)}
.hl .ht{font-weight:700; font-size:13px}
.hl .hd{color:var(--ink-soft); font-size:12px; margin-top:3px; line-height:1.7}
.hl .hm{color:var(--ink-mute); font-size:10.5px; margin-top:5px}

.chk-groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 18px; margin-top:14px}
.chk-group h4{margin:0 0 5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute)}
.chk{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:2px 0; cursor:pointer}
.chk input{accent-color:var(--accent); width:15px; height:15px}
.chk .pv{color:var(--ink-mute); font-size:9.5px}
.pick-warn{font-size:11px; color:var(--rise); margin:6px 0 0}
.seg{display:inline-flex; background:var(--sink); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; font-size:11.5px; padding:4px 9px; border-radius:6px; color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--panel); color:var(--ink); font-weight:700; box-shadow:var(--shadow-1)}
.ctrlrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
table.src{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px}
table.src th,table.src td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line-soft)}
table.src th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-mute)}
.badge{font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:999px}
.badge.real{color:var(--fall); background:color-mix(in srgb,var(--fall) 13%,transparent)}
.badge.prov{color:var(--rise); background:color-mix(in srgb,var(--rise) 13%,transparent)}
.grouphdr td{font-weight:700; font-size:10px; letter-spacing:.05em; color:var(--ink-mute); background:var(--raise); text-transform:uppercase}
.tbl-scroll{overflow-x:auto}
.abt{font-size:13px; line-height:1.85; color:var(--ink-soft)}
.abt p{margin:12px 0 0}

@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.fade{animation:fade .16s ease both}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>調達アラート</div>
    <div class="spacer"></div>
    <div class="stamp"><span>相場 <b id="stampData"></b></span><br><span id="stampNews"></span></div>
    <button class="tglt" id="themeToggle" type="button" aria-label="配色を切り替え"></button>
  </header>
  <div class="body">
    <nav class="rail" aria-label="部材区分">
      <div class="rail-head">
        <span class="lbl">部材区分</span>
        <button class="sortbtn" id="sortBtn" type="button">逼迫順</button>
      </div>
      <ul class="navlist" id="navList"></ul>
      <div class="rail-sep" role="separator"></div>
      <ul class="navlist" id="auxList"></ul>
    </nav>
    <main class="pane" id="pane"><div class="pane-inner" id="paneInner"></div></main>
  </div>
</div>

<script id="appdata" type="application/json">__DATA__</script>
<script id="newsdata" type="application/json">__NEWS__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('appdata').textContent);
var NEWS = null;
try{ NEWS = JSON.parse(document.getElementById('newsdata').textContent); }catch(e){ NEWS = null; }
var MAT = DATA.materials, IND = DATA.indicators, CATS = DATA.categories, ANN = DATA.annotations;
var M = DATA.meta.months, N = M.length;
var SVGNS = 'http://www.w3.org/2000/svg';
var PAL = ['#2a78d6','#d9772f','#1f9d6f','#c99a1e','#c76b9a','#7a5cd0'];
var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function series(id){ return MAT[id] || IND[id]; }
function jp(d){ var a=d.split('-'); return a[0]+'年'+(+a[1])+'月'; }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function fmtN(v,dec){ return (v==null)?'–':v.toLocaleString('en-US',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function fmtPct(v){ return (v==null)?'–':((v>=0?'+':'')+v.toFixed(0)+'%'); }
function fmtPct1(v){ return (v==null)?'–':((v>=0?'+':'')+v.toFixed(1)+'%'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

var _al = {};
function aligned(id){
  if(_al[id]) return _al[id];
  var s = series(id); var map = {}; s.points.forEach(function(p){ map[p.date]=p.value; });
  var last=null, out=M.map(function(m){ if(map[m]!=null) last=map[m]; return map[m]!=null?map[m]:last; });
  _al[id]=out; return out;
}
function pctChg(arr,i,back){ var a=arr[i-back], b=arr[i]; if(a==null||b==null||a===0||i-back<0) return null; return (b/a-1)*100; }
function matMom(id,i){
  var arr=aligned(id), yoy=pctChg(arr,i,12), q=pctChg(arr,i,3);
  var qa = q==null?null:(Math.pow(1+q/100,4)-1)*100;
  if(yoy==null&&qa==null) return null;
  if(yoy==null) return qa; if(qa==null) return yoy;
  return 0.6*yoy + 0.4*qa;
}
function nMom(x){ return 100/(1+Math.exp(-(x-8)/20)); }
function leadStress(i){
  var cur=aligned('deliveryNY')[i], fut=aligned('deliveryFutNY')[i];
  var blend = 0.7*(cur==null?0:cur) + 0.3*(fut==null?0:fut);
  return clamp(45 + blend*1.5, 0, 100);
}
function sectorMom(i){
  var v=[matMom('wsts',i), matMom('semiBill',i)].filter(function(x){return x!=null;});
  if(!v.length) return null;
  return nMom(v.reduce(function(a,b){return a+b;},0)/v.length);
}
function basketMom(cat,i){
  var sum=0,w=0;
  cat.basket.forEach(function(p){ var m=matMom(p[0],i); if(m!=null){ sum+=m*p[1]; w+=p[1]; } });
  return w? sum/w : null;
}
function catScore(cat,i){
  var pm=basketMom(cat,i), pmN=(pm==null)?50:nMom(pm);
  var ls=leadStress(i);
  if(cat.sector==='semi'){
    var sm=sectorMom(i); if(sm==null) sm=pmN;
    return 0.42*pmN + 0.30*ls + 0.28*sm;
  }
  return 0.58*pmN + 0.42*ls;
}
function catLead(cat,i){
  var pm=basketMom(cat,i), pmN=(pm==null)?50:nMom(pm);
  return 0.55*leadStress(i) + 0.45*pmN;
}
var LEVELS=[{k:0,t:'緩和'},{k:1,t:'通常'},{k:2,t:'やや逼迫'},{k:3,t:'逼迫'},{k:4,t:'深刻'}];
function level(s){ return s<25?LEVELS[0] : s<42?LEVELS[1] : s<58?LEVELS[2] : s<74?LEVELS[3] : LEVELS[4]; }
function scoreHistory(cat){ var out=[]; for(var i=12;i<N;i++) out.push(catScore(cat,i)); return out; }
function basketYoY(cat){
  var sum=0,w=0;
  cat.basket.forEach(function(p){ var y=pctChg(aligned(p[0]),N-1,12); if(y!=null){ sum+=y*p[1]; w+=p[1]; } });
  return w? sum/w : null;
}
function percentile(cat, s){
  var h=scoreHistory(cat), below=h.filter(function(x){return x<=s;}).length;
  return Math.round(below/h.length*100);
}
function analogEra(cat, s){
  var idxOf={}; M.forEach(function(m,i){ idxOf[m]=i; });
  var best=null, bestD=1e9;
  ANN.forEach(function(a){
    var s0=idxOf[a.start], s1=idxOf[a.end]; if(s0==null||s1==null) return;
    var vals=[]; for(var i=Math.max(12,s0);i<=s1&&i<N;i++) vals.push(catScore(cat,i));
    if(!vals.length) return;
    var avg=vals.reduce(function(x,y){return x+y;},0)/vals.length;
    var d=Math.abs(avg-s);
    if(d<bestD){ bestD=d; best={a:a, avg:avg}; }
  });
  return best;
}
function driverOf(cat){
  return cat.basket.map(function(p){ return {id:p[0], w:p[1], m:matMom(p[0],N-1), y:pctChg(aligned(p[0]),N-1,12)}; })
    .sort(function(a,b){ return (b.m==null?-999:b.m)-(a.m==null?-999:a.m); })[0];
}

/* ---- plain-language read ---- */
function readCat(cat){
  var s=catScore(cat,N-1), lv=level(s), y=basketYoY(cat), d=driverOf(cat), ls=leadStress(N-1);
  var pct=percentile(cat,s), era=analogEra(cat,s);
  var lt=catLead(cat,N-1), dlt=lt-catLead(cat,N-4);
  var cost;
  if(y==null) cost='構成材料の相場データが不足しています。';
  else if(y>=8) cost='構成材料の価格は前年比 <b>'+fmtPct(y)+'</b>。材料費ベースの値上げがこの範囲までなら相場並みで、押し返す根拠は乏しい水準です。';
  else if(y<=-8) cost='構成材料の価格は前年比 <b>'+fmtPct(y)+'</b>。値上げ要求には逆風。むしろ値下げ交渉の余地があります。';
  else cost='構成材料の価格は前年比 <b>'+fmtPct1(y)+'</b>。ほぼ横ばいで、大きな値上げは相場では説明できません。';
  var dc=aligned('deliveryNY')[N-1], df=aligned('deliveryFutNY')[N-1];
  var supply='NY連銀 製造業調査の「仕入先の納期」拡散指数は現況 <b>'+dc.toFixed(1)+'</b>、6ヶ月先 <b>'+df.toFixed(1)+'</b>（0超＝多数が「長期化している」と回答）。'
    + (era && lv.k>=2 ? 'この区分のひっ迫度は<b>'+esc(era.a.label)+'</b>と近い水準です。' : (dc>0?'足元は横ばい〜やや長期化方向です。':'足元は落ち着いています。'));
  var verdict, vk;
  if(lv.k>=3){ vk='値上げ・納期延長の回答は相場的に妥当'; verdict='押し返すより、<b>前倒し発注・複数社見積り・在庫水準の見直し</b>に動く局面です。'; }
  else if(lv.k===2){ vk='上昇の入り口。個別に根拠確認を'; verdict='値上げ要求は具体的な根拠を確認しつつ、<b>次ロットの前倒しと代替品の下調べ</b>を始めておく局面です。'; }
  else { vk='値上げ・納期延長には根拠を求めてよい'; verdict='相場・納期とも大きな動きはありません。<b>具体的な裏付けを出してもらう</b>のが妥当です。'; }
  return {s:s, lv:lv, y:y, d:d, ls:ls, pct:pct, era:era, lt:lt, dlt:dlt, cost:cost, supply:supply, verdict:verdict, vk:vk};
}
function leadWord(){
  var ls=leadStress(N-1);
  return ls>=66?'長期化':ls>=52?'やや長め':'通常';
}
function railStat(cat){
  return '価格 '+fmtPct(basketYoY(cat))+' ・ 納期 '+leadWord();
}

/* ---- news ---- */
function newsFor(id){
  if(!NEWS) return {note:null, lines:[]};
  var note = NEWS.categoryNotes ? NEWS.categoryNotes[id] : null;
  var lines = (NEWS.headlines||[]).filter(function(h){ return (h.cats||[]).indexOf(id)>=0; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,3);
  return {note:note, lines:lines};
}

/* ---- svg helpers ---- */
function el(tag,attrs,text){ var e=document.createElementNS(SVGNS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; return e; }
function niceScale(min,max,ticks){
  ticks=ticks||5; var span=(max-min)||1, s0=span/ticks;
  var mag=Math.pow(10,Math.floor(Math.log10(s0))), norm=s0/mag;
  var step=(norm>5?10:norm>2?5:norm>1?2:1)*mag;
  var nmin=Math.floor(min/step)*step, nmax=Math.ceil(max/step)*step, out=[];
  for(var v=nmin;v<=nmax+step*1e-6;v+=step) out.push(+v.toFixed(6));
  return {min:nmin,max:nmax,ticks:out};
}
function shortLabel(id){
  var map={copper:'銅',aluminum:'アルミ',nickel:'Ni',tin:'すず',zinc:'亜鉛',lead:'鉛',gold:'金',silver:'銀',
    ironore:'鉄鉱石',steel:'鋼材',crude:'原油',natgas:'ガス',resin:'樹脂',resinmfg:'樹脂製造',pcb:'基板',
    eleccomp:'電子部品',semippi:'半導体',metals:'金属PPI',dram:'DRAM',nand:'NAND',
    deliveryNY:'納期(現況)',deliveryFutNY:'納期(先行)',ordersNY:'受注DI',durables:'耐久財',wsts:'半導体売上',semiBill:'装置出荷'};
  return map[id]||id;
}
function sparkSvg(vals){
  var w=300,h=44,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=(mx-mn)||1;
  var d=vals.map(function(v,i){ return (i?'L':'M')+(w*i/(vals.length-1)).toFixed(1)+' '+(h-3-(h-6)*(v-mn)/sp).toFixed(1); }).join(' ');
  var lx=w, ly=h-3-(h-6)*(vals[vals.length-1]-mn)/sp;
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
    +'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.6" fill="currentColor"/></svg>';
}
function makeChart(host, cfg){
  var mode=cfg.mode||'index', kind=cfg.kind||'line';
  var months = cfg.range==='all'||!cfg.range ? M.slice() : M.slice(Math.max(0, N - ({'5y':60,'3y':36,'1y':12}[cfg.range]||N)));
  var offset = N - months.length;
  var W=920, H=cfg.height||280, m={t:12,r:68,b:24,l:50};
  var pw=W-m.l-m.r, ph=H-m.t-m.b, n=months.length;
  function xs(i){ return m.l + (n<=1?pw/2:pw*i/(n-1)); }
  var ser = cfg.ids.map(function(id,idx){
    var a=aligned(id);
    var raw=months.map(function(_,i){ return a[offset+i]; });
    var base=raw.find(function(x){return x!=null;});
    var data = (kind==='diff'||mode==='raw') ? raw.slice() : raw.map(function(x){ return x==null?null:x/base*100; });
    return {id:id, color:cfg.colors?cfg.colors[idx]:PAL[idx%PAL.length],
            ref:(cfg.refIds&&cfg.refIds.indexOf(id)>=0), raw:raw, data:data, short:shortLabel(id)};
  });
  var vmin=Infinity,vmax=-Infinity;
  ser.forEach(function(s){ s.data.forEach(function(v){ if(v!=null){ if(v<vmin)vmin=v; if(v>vmax)vmax=v; } }); });
  if(kind==='diff'){ vmin=Math.min(vmin,0); vmax=Math.max(vmax,0); }
  var pad=(vmax-vmin)*0.10||1, sc=niceScale(vmin-pad, vmax+pad, 5);
  function ys(v){ return m.t + ph*(1-(v-sc.min)/(sc.max-sc.min)); }
  var svg=el('svg',{viewBox:'0 0 '+W+' '+H, class:'chart', preserveAspectRatio:'xMidYMid meet', role:'img'});
  if(cfg.bands){
    var idxOf={}; M.forEach(function(mm,i){ idxOf[mm]=i; });
    ANN.forEach(function(a){
      var s0=idxOf[a.start], s1=idxOf[a.end];
      if(s1<offset || s0>offset+n-1) return;
      var x0=xs(Math.max(0,s0-offset)), x1=xs(Math.min(n-1,s1-offset));
      svg.appendChild(el('rect',{class:'band', x:x0, y:m.t, width:Math.max(1,x1-x0), height:ph}));
      svg.appendChild(el('line',{class:'band-edge', x1:x0, y1:m.t, x2:x0, y2:m.t+ph}));
    });
  }
  sc.ticks.forEach(function(t){
    var y=ys(t);
    svg.appendChild(el('line',{class:(kind==='diff'&&t===0)?'zero':'grid', x1:m.l, y1:y, x2:W-m.r, y2:y}));
    svg.appendChild(el('text',{x:m.l-8, y:y+3.5, 'text-anchor':'end', 'font-size':10.5},
      (mode==='index'&&kind!=='diff')? fmtN(t,0) : fmtN(t, Math.abs(t)<200?1:0)));
  });
  var lastYr=null;
  months.forEach(function(mo,i){
    var pr=mo.split('-'), yr=pr[0], mn=+pr[1], show=false, lab='';
    if(cfg.range==='1y'){ if(i%2===0){ show=true; lab=mn+'月'; } }
    else if(yr!==lastYr && mn<=1){ show=true; lab=yr; }
    if(mn===1) lastYr=yr;
    if(show){ var x=xs(i);
      svg.appendChild(el('line',{class:'grid', x1:x, y1:m.t+ph, x2:x, y2:m.t+ph+4}));
      svg.appendChild(el('text',{x:x, y:m.t+ph+15, 'text-anchor':'middle', 'font-size':10.5}, lab));
    }
  });
  svg.appendChild(el('line',{class:'axis-line', x1:m.l, y1:m.t+ph, x2:W-m.r, y2:m.t+ph}));
  ser.forEach(function(s){
    var d='', pen=false;
    s.data.forEach(function(v,i){ if(v==null){ pen=false; return; }
      d+=(pen?' L ':' M ')+xs(i).toFixed(1)+' '+ys(v).toFixed(1); pen=true; });
    svg.appendChild(el('path',{class:'serie'+(s.ref?' ref':''), d:d, stroke:s.color}));
  });
  var labels=[];
  ser.forEach(function(s){ for(var i=s.data.length-1;i>=0;i--){ if(s.data[i]!=null){
    labels.push({y:ys(s.data[i]), x:xs(i), color:s.color, text:s.short}); break; } } });
  labels.sort(function(a,b){return a.y-b.y;});
  for(var li=1;li<labels.length;li++){ if(labels[li].y-labels[li-1].y<12) labels[li].y=labels[li-1].y+12; }
  labels.forEach(function(L){
    svg.appendChild(el('circle',{class:'dot', cx:L.x, cy:L.y, r:3, fill:L.color}));
    svg.appendChild(el('text',{class:'end-label', x:L.x+7, y:L.y+3.5, style:'fill:'+L.color, 'font-size':11}, L.text));
  });
  var cross=el('line',{class:'cross', x1:0, y1:m.t, x2:0, y2:m.t+ph, opacity:0}); svg.appendChild(cross);
  var hit=el('rect',{x:m.l, y:m.t, width:pw, height:ph, fill:'transparent', style:'cursor:crosshair'}); svg.appendChild(hit);
  host.innerHTML='';
  var wrap=document.createElement('div'); wrap.style.position='relative'; wrap.appendChild(svg);
  var tt=document.createElement('div'); tt.className='tt'; wrap.appendChild(tt);
  host.appendChild(wrap);
  function locate(clientX){
    var box=svg.getBoundingClientRect(), ratio=W/box.width, lx=(clientX-box.left)*ratio;
    return clamp(Math.round((lx-m.l)/(pw||1)*(n-1)), 0, n-1);
  }
  function show(clientX){
    var i=locate(clientX), x=xs(i);
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('opacity',1);
    var rows=ser.map(function(s){
      if(s.data[i]==null) return '';
      var rv=s.raw[i], txt=(mode==='index'&&kind!=='diff')? (Math.round(s.data[i])+'  ('+fmtN(rv, Math.abs(rv)<200?1:0)+')') : fmtN(rv, Math.abs(rv)<200?1:0);
      return '<div class="tt-r"><span><i class="sw" style="background:'+s.color+'"></i>'+s.short+'</span><b class="mono">'+txt+'</b></div>';
    }).join('');
    tt.innerHTML='<div class="tt-d">'+jp(months[i])+'</div>'+rows;
    tt.style.opacity=1;
    var box=svg.getBoundingClientRect(), px=(x/W)*box.width, tw=tt.offsetWidth;
    tt.style.left=Math.min(box.width-tw-4, Math.max(4, px+12))+'px'; tt.style.top='6px';
  }
  function hide(){ tt.style.opacity=0; cross.setAttribute('opacity',0); }
  hit.addEventListener('pointermove', function(e){ show(e.clientX); });
  hit.addEventListener('pointerdown', function(e){ show(e.clientX); });
  hit.addEventListener('pointerleave', hide);
  return ser;
}

    +'<p class="tech-note">スコア = 構成材料の価格モメンタム（前年比60%＋直近3ヶ月の年率40%、ロジスティック正規化）と NY連銀の納期拡散指数（現況70%＋先行30%）を およそ 58:42 で加重。半導体系は業界需給を約3割ブレンド。バスケット: '
      + cat.basket.map(function(p){ return esc(series(p[0]).label)+' '+Math.round(p[1]*100)+'%'; }).join(' / ') +'。個社ごとの実リードタイム（○週）は公開データが無く、推計です。</p>'
    +'</details>';
  return {html:h, after:function(){
    makeChart(document.getElementById('priceChart'), {ids:ids, mode:'index', range:'5y', bands:true, refIds:refIds, height:240});
  }};
}
function fig(k,v,cls){ return '<div class="fig"><div class="fk">'+esc(k)+'</div><div class="fv '+(cls||'')+'">'+v+'</div></div>'; }

function newsPane(){
  var h='<button class="backbtn" type="button" id="backBtn">‹ 区分一覧</button>';
  h+='<div class="dhead"><h2>市況ニュース</h2></div>';
  if(!NEWS){ h+='<p class="dsub">市況データがありません。</p>'; return {html:h}; }
  h+='<p class="dsub">'+esc(NEWS.updatedLabel||'')+' 更新 ／ Web検索で自動収集（脇の参考情報です）</p>';
  if(NEWS.summary) h+='<p class="mkt-summary">'+esc(NEWS.summary)+'</p>';
  if(NEWS.spot&&NEWS.spot.length){
    h+='<div class="block"><h3>主要な相場</h3><div class="spotgrid">'+NEWS.spot.map(function(s){
      var down=/[-−▼]|下落|安/.test(s.chg||'');
      return '<div class="spot"><div class="sl">'+esc(s.label)+'</div><div class="sv mono">'+esc(s.level||'')+'</div>'
        +'<div class="sc mono" style="color:'+(down?'var(--fall)':'var(--rise)')+'">'+esc(s.chg||'')+'</div>'
        +(s.note?'<div class="sn">'+esc(s.note)+'</div>':'')+'</div>';
    }).join('')+'</div></div>';
  }
  if(NEWS.headlines&&NEWS.headlines.length){
    h+='<div class="block"><h3>ヘッドライン</h3>'+NEWS.headlines.map(function(x){
      var sev=x.severity==='high'?'sev-high':x.severity==='low'?'':'sev-med';
      return '<div class="hl '+sev+'"><div class="ht">'+esc(x.title||'')+'</div>'
        +(x.detail?'<div class="hd">'+esc(x.detail)+'</div>':'')
        +'<div class="hm">'+esc([x.date,x.theme,x.source].filter(Boolean).join(' ・ '))+'</div></div>';
    }).join('')+'</div>';
  }
  if(NEWS.geopolitics&&NEWS.geopolitics.length){
    h+='<div class="block"><h3>地政学・政策</h3>'+NEWS.geopolitics.map(function(g){
      return '<div class="hl sev-med"><div class="ht">'+esc(g.title||'')+'</div>'
        +(g.detail?'<div class="hd">'+esc(g.detail)+'</div>':'')
        +(g.source?'<div class="hm">'+esc(g.source)+'</div>':'')+'</div>';
    }).join('')+'</div>';
  }
  return {html:h};
}

var xp={ picks:['copper','gold','resin','dram'], mode:'index', range:'all' };
try{ var sv=JSON.parse(localStorage.getItem('buzai_xp')||'{}');
  if(Array.isArray(sv.picks)) xp.picks=sv.picks.filter(function(id){return MAT[id]||IND[id];}).slice(0,6);
  if(sv.mode==='raw'||sv.mode==='index') xp.mode=sv.mode;
  if(['all','5y','3y','1y'].indexOf(sv.range)>=0) xp.range=sv.range;
}catch(e){}
function xpSave(){ try{ localStorage.setItem('buzai_xp', JSON.stringify(xp)); }catch(e){} }
function explorePane(){
  var groups={}; Object.keys(MAT).forEach(function(id){ (groups[MAT[id].group]=groups[MAT[id].group]||[]).push(id); });
  var h='<button class="backbtn" type="button" id="backBtn">‹ 区分一覧</button>';
  h+='<div class="dhead"><h2>相場を自分で見る</h2></div>';
  h+='<p class="dsub">原材料・指標を選んで時系列を重ねる。数字を細かく追いたいとき向け（最大6件）。</p>';
  h+='<div class="chk-groups">';
  DATA.groups.concat(['指標']).forEach(function(gname){
    var ids = gname==='指標' ? Object.keys(IND) : (groups[gname]||[]);
    if(!ids.length) return;
    h+='<div class="chk-group"><h4>'+esc(gname)+'</h4>'+ids.map(function(id){
      var s=series(id);
      return '<label class="chk"><input type="checkbox" value="'+id+'"'+(xp.picks.indexOf(id)>=0?' checked':'')+'>'
        +'<span>'+esc(s.label)+(s.provisional?' <span class="pv">暫定</span>':'')+'</span></label>';
    }).join('')+'</div>';
  });
  h+='</div><p class="pick-warn" id="pickWarn"'+(xp.picks.length<6?' hidden':'')+'>最大6件です。ほかのチェックを外してください。</p>';
  h+='<div class="ctrlrow"><div class="seg" id="xpMode">'
    +'<button data-v="index" aria-pressed="'+(xp.mode==='index')+'">指数（期初=100）</button>'
    +'<button data-v="raw" aria-pressed="'+(xp.mode==='raw')+'">実額</button></div>'
    +'<div class="seg" id="xpRange">'
    +['all:全期間','5y:5年','3y:3年','1y:1年'].map(function(o){var a=o.split(':');return '<button data-v="'+a[0]+'" aria-pressed="'+(xp.range===a[0])+'">'+a[1]+'</button>';}).join('')
    +'</div></div>';
  h+='<div class="chart-wrap"><div id="xpChart"></div></div><div class="legend" id="xpLegend"></div>';
  return {html:h, after:function(){ wireExplore(); drawExplore(); }};
}
function drawExplore(){
  var host=document.getElementById('xpChart');
  if(!xp.picks.length){ host.innerHTML='<p style="color:var(--ink-mute);font-size:13px;padding:16px 2px">素材を1件以上選んでください。</p>'; document.getElementById('xpLegend').innerHTML=''; return; }
  var refIds=xp.picks.filter(function(id){ return series(id).provisional; });
  makeChart(host, {ids:xp.picks, mode:xp.mode, range:xp.range, bands:false, refIds:refIds, height:300});
  document.getElementById('xpLegend').innerHTML=legendHTML(xp.picks, refIds);
}
function wireExplore(){
  [].forEach.call(document.querySelectorAll('#paneInner .chk input'), function(inp){
    inp.addEventListener('change', function(){
      if(this.checked){ if(xp.picks.length>=6){ this.checked=false; document.getElementById('pickWarn').hidden=false; return; } xp.picks.push(this.value); }
      else xp.picks=xp.picks.filter(function(x){return x!==inp.value;});
      document.getElementById('pickWarn').hidden = xp.picks.length<6;
      xpSave(); drawExplore();
    });
  });
  function seg(id,key){ document.getElementById(id).addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return; xp[key]=b.dataset.v; xpSave();
    [].forEach.call(this.children,function(x){ x.setAttribute('aria-pressed', x===b); }); drawExplore();
  }); }
  seg('xpMode','mode'); seg('xpRange','range');
}

function aboutPane(){
  var h='<button class="backbtn" type="button" id="backBtn">‹ 区分一覧</button>';
  h+='<div class="dhead"><h2>このボードについて</h2></div>';
  h+='<div class="abt">'
    +'<p>仕入先から「値上げ」「納期を延ばしたい」と言われたとき、それが<b>相場や公開統計で裏付けられるか</b>を、部材の区分ごとに確認するための道具です。各社の生産管理システムとは連携せず、公開されている相場・市況・サプライチェーン統計のみを使います。</p>'
    +'<p>各区分の状態は、構成材料の相場の勢い（前年比・直近の年率）と、NY連銀 製造業調査の「仕入先の納期」拡散指数を組み合わせた<b>推計</b>です。個社ごとの実リードタイム（○週）は公開データが無いため持っていません。数値そのものより「<b>いつの時期と同じくらいか</b>」と「<b>方向</b>」を見てください。</p>'
    +'<p id="methodP" style="color:var(--ink-mute);font-size:12px"></p>'
    +'<p><b>状態の目安</b> — 緩和: 値下げ交渉の余地 ／ 通常: 個別に根拠確認 ／ やや逼迫: 代替品の下調べ・前倒し準備 ／ 逼迫: 値上げ回答は妥当、前倒し発注・複数社見積り ／ 深刻: 過去の危機並み、在庫確保・設計変更も視野</p>'
    +'<p><b>自動更新</b> — 相場・統計は月次。市況ニュースは毎朝クラウドがWeb検索で収集しています。</p>'
    +'</div>';
  h+='<div class="block"><h3>データソース</h3><div class="tbl-scroll"><table class="src"><thead><tr><th>指標</th><th>ソース</th><th></th></tr></thead><tbody id="srcBody"></tbody></table></div></div>';
  return {html:h, after:function(){
    document.getElementById('methodP').textContent = DATA.method;
    var tb=document.getElementById('srcBody');
    function grp(name, ids){
      var tr=document.createElement('tr'); tr.className='grouphdr'; tr.innerHTML='<td colspan="3">'+esc(name)+'</td>'; tb.appendChild(tr);
      ids.forEach(function(id){ var s=series(id), r=document.createElement('tr');
        r.innerHTML='<td>'+esc(s.label)+'</td><td><a href="'+esc(s.sourceUrl)+'" target="_blank" rel="noopener">'+esc(s.source)+'</a></td>'
          +'<td>'+(s.provisional?'<span class="badge prov">暫定</span>':'<span class="badge real">実データ</span>')+'</td>';
        tb.appendChild(r);
      });
    }
    var byG={}; Object.keys(MAT).forEach(function(id){ (byG[MAT[id].group]=byG[MAT[id].group]||[]).push(id); });
    DATA.groups.forEach(function(g){ if(byG[g]) grp(g, byG[g]); });
    grp('サプライチェーン・需給指標', Object.keys(IND));
  }};
}

/* ---- render ---- */
function render(){
  renderRail();
  var inner=document.getElementById('paneInner');
  var out;
  if(current==='news') out=newsPane();
  else if(current==='explore') out=explorePane();
  else if(current==='about') out=aboutPane();
  else {
    var id=current.indexOf('c/')===0 ? current.slice(2) : null;
    var cat=id && CATS.filter(function(c){return c.id===id;})[0];
    if(!cat){ cat=orderedCats()[0].c; current='c/'+cat.id; }
    out=catPane(cat);
  }
  inner.className='pane-inner'+(reduceMotion?'':' fade');
  inner.innerHTML=out.html;
  if(out.after) out.after();
  var bb=document.getElementById('backBtn');
  if(bb) bb.addEventListener('click', function(){ document.body.classList.remove('detail-open'); });
  // retrigger fade
  if(!reduceMotion){ inner.style.animation='none'; void inner.offsetWidth; inner.style.animation=''; }
}

/* ---- init ---- */
document.getElementById('stampData').textContent = DATA.meta.rangeEnd.replace('-','年')+'月時点';
if(NEWS && NEWS.updatedLabel) document.getElementById('stampNews').innerHTML='市況 <b>'+esc(NEWS.updatedLabel.replace(/^2026年/,''))+'</b>';
if(current) document.body.classList.add('detail-open');
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
  var s=null; try{ s=localStorage.getItem(TKEY); }catch(e){}
  if(s!=='light'&&s!=='dark') applyTheme(curTheme());
});
render();
})();
</script>
